events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 80 default_server;
    server_name localhost jdhub.jdeere.net _;

    # File quotas and safety checks are enforced by the backend. Do not let
    # Nginx's 1 MB default reject normal uploads before they reach the API.
    client_max_body_size 0;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://backend:3000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://backend:3000/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /site.webmanifest {
      default_type application/manifest+json;
      try_files $uri =404;
    }

    location ^~ /s/ {
      # Always load the public-share shell. The backend API remains the
      # authority for whether the token is valid, revoked, or expired.
      rewrite ^ /share.html break;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  server {
    listen 80;
    server_name share.jdeere.net;

    root /usr/share/nginx/html;
    index share-landing.html;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;

    location = / {
      try_files /share-landing.html =404;
    }

    location ^~ /s/ {
      # Load the anonymous share shell for every token-shaped route. The
      # public-share API validates expiry, revocation, and resource access.
      rewrite ^ /share.html break;
    }

    location ^~ /api/public-shares/ {
      proxy_pass http://backend:3000/api/public-shares/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
      try_files $uri =404;
    }

    location = /share-icon.svg {
      try_files $uri =404;
    }

    location / {
      return 404;
    }
  }
}
