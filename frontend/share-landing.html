<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/share-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Secure file sharing</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f8fb; color: #18212f; padding: 24px; }
      main { width: min(100%, 560px); padding: 48px; text-align: center; background: #fff; border: 1px solid #dfe5ed; border-radius: 20px; box-shadow: 0 18px 50px rgba(24, 33, 47, .08); }
      .icon { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 22px; border-radius: 16px; background: #e7f8f5; color: #087d70; }
      svg { width: 28px; height: 28px; }
      h1 { margin: 0; font-size: clamp(1.75rem, 5vw, 2.25rem); letter-spacing: -.035em; }
      p { margin: 14px auto 0; max-width: 420px; color: #667085; line-height: 1.65; }
      small { display: block; margin-top: 28px; color: #98a2b3; }
      @media (max-width: 520px) { main { padding: 36px 24px; border-radius: 16px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18h11a4 4 0 0 0 .7-7.94A6 6 0 0 0 6.26 8.5 4.75 4.75 0 0 0 6 18Z"/></svg>
      </div>
      <h1>Secure file sharing</h1>
      <p>Open the complete link provided by the sender to access a shared file or folder.</p>
      <small>Temporary links expire automatically.</small>
    </main>
  </body>
</html>
